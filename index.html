<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#0B9EDA;--bd:#0C6FA3;--bl:#E6F6FD;--g:#5BBD4E;--gd:#3D8A32;--gl:#EDF7EA;--tx:#1a2e4a;--gr:#64748B;--br:#E2E8F0;--bg:#F0F5FA}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--br);padding:0 24px;display:flex;align-items:center;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.logo{height:38px}
.nav{display:flex;gap:2px;margin-left:auto}
.nb{background:none;border:none;cursor:pointer;padding:7px 13px;border-radius:8px;font-size:13px;color:var(--gr);font-family:'DM Sans',sans-serif;transition:all .15s;position:relative}
.nb:hover{background:var(--bl);color:var(--bd)}
.nb.on{background:var(--bl);color:var(--b);font-weight:500}
.badge{position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;font-weight:600;padding:1px 5px;min-width:16px;text-align:center;display:none}
.app{flex:1;padding:24px;max-width:1000px;margin:0 auto;width:100%}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.met{background:#fff;border:.5px solid var(--br);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.mst{position:absolute;top:0;left:0;right:0;height:3px}
.mlb{font-size:11px;color:var(--gr);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.mv{font-size:26px;font-weight:500;line-height:1}
.ms{font-size:11px;color:#94a3b8;margin-top:4px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.st{font-size:11px;font-weight:500;color:var(--gr);text-transform:uppercase;letter-spacing:.06em}
.btn{background:#fff;border:.5px solid #cbd5e1;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--tx);font-family:'DM Sans',sans-serif;transition:all .15s}
.btn:hover{background:#f8fafc;border-color:var(--gr)}
.btnp{background:var(--b);border-color:var(--b);color:#fff}
.btnp:hover{background:var(--bd)}
.btns{background:var(--g);border-color:var(--g);color:#fff}
.btns:hover{background:var(--gd)}
.btnsm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:.5px solid var(--br);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 16px;font-weight:500;font-size:11px;color:var(--gr);border-bottom:.5px solid #f1f5f9;background:#fafbfd;text-transform:uppercase;letter-spacing:.06em}
.tbl td{padding:11px 16px;border-bottom:.5px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bl)}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.cg{background:#eaf3de;color:#3b6d11}.cr{background:#fcebeb;color:#a32d2d}
.ca{background:#faeeda;color:#854f0b}.cb{background:var(--bl);color:var(--bd)}
.cgr{background:#f1f5f9;color:#64748b}.cp{background:#eeedfe;color:#534ab7}
.ct{background:#e1f5ee;color:#0f6e56}
.tog{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#e2e8f0;border-radius:20px;transition:.2s}
.sl:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:var(--b)}
input:checked+.sl:before{transform:translateX(16px)}
.ov{position:fixed;inset:0;background:rgba(15,35,64,.35);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.mod{background:#fff;border-radius:14px;border:.5px solid var(--br);width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.mhd{padding:18px 22px;border-bottom:.5px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between}
.mtt{font-size:15px;font-weight:500}
.mbd{padding:22px}
.mft{padding:14px 22px;border-top:.5px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:500;color:var(--gr);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.fi{width:100%;padding:8px 11px;border:.5px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;color:var(--tx);font-family:'DM Sans',sans-serif;transition:border .15s}
.fi:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px var(--bl)}
textarea.fi{resize:vertical;min-height:64px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tabs{display:flex;gap:2px;margin-bottom:16px;background:#f1f5f9;padding:3px;border-radius:9px;width:fit-content}
.tab{padding:5px 14px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--gr);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.tab.on{background:#fff;color:var(--b);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.cc{background:#fff;border:.5px solid var(--br);border-radius:12px;overflow:hidden;margin-bottom:12px}
.ch{padding:14px 18px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--g));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.cb2{padding:12px 18px;border-top:.5px solid #f1f5f9;background:#fafbfd}
.ai{background:#fff;border:.5px solid var(--br);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.ai:last-child{margin-bottom:0}
.emp{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
.abanner{background:#faeeda;border:.5px solid #fac775;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.aitem{background:#fff;border:.5px solid #fac775;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qprog{background:#e2e8f0;border-radius:10px;height:6px;overflow:hidden;margin-top:6px}
.qbar{background:var(--b);height:100%;border-radius:10px}
.ibox{background:var(--bl);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--bd);font-weight:500}
.iboxg{background:var(--gl);color:var(--gd)}
</style>
</head>
<body>
<div id="login-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:99999;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:40px 48px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,.08);text-align:center">
    <div style="font-size:22px;font-weight:700;color:var(--tx);margin-bottom:6px">QP C&IA</div>
    <div style="font-size:13px;color:var(--tx2);margin-bottom:28px">Panel de operaciones</div>
    <input id="login-pass" type="password" placeholder="Contraseña" style="width:100%;padding:10px 14px;border:.5px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--tx);outline:none;margin-bottom:12px;display:block">
    <div id="login-err" style="color:#E53E3E;font-size:12px;margin-bottom:8px;display:none">Contraseña incorrecta</div>
    <button onclick="doLogin()" style="width:100%;padding:10px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer">Entrar</button>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem('qp_auth')==='ok') return;
  var ls=document.getElementById('login-screen');
  ls.style.display='flex';
  document.body.style.overflow='hidden';
  document.getElementById('login-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  setTimeout(function(){ document.getElementById('login-pass').focus(); },100);
})();
function doLogin(){
  if(document.getElementById('login-pass').value==='Pedrito25'){
    sessionStorage.setItem('qp_auth','ok');
    document.getElementById('login-screen').style.display='none';
    document.body.style.overflow='';
  } else {
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-pass').value='';
    document.getElementById('login-pass').focus();
  }
}
</script>
<div style="display:flex;flex-direction:column;min-height:100vh">
  <div class="top">
    <img id="logo" class="logo" alt="QP C&IA" style="height:38px;object-fit:contain">
    <nav class="nav">
      <button class="nb on" id="nb-dash" onclick="go('dash')">Dashboard</button>

      <button class="nb" id="nb-salud" onclick="go('salud')">Salud &#x2665;</button>
      <button class="nb" id="nb-gastos" onclick="go('gastos')">Finanzas</button>
    </nav>
  </div>

</div>
